
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
 background:#0f0f0f;
 color:white;
 font-family:Arial,sans-serif;
}

/* HEADER */
header{
 height:65px;
 position:fixed;
 top:0;
 left:0;
 width:100%;
 background:#0f0f0f;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 25px;
 z-index:100;
}

.logo{
 font-size:25px;
 font-weight:bold;
 letter-spacing:-1px;
}

.logo span{color:red}

.search{
 display:flex;
 width:45%;
 max-width:550px;
}

.search input{
 flex:1;
 min-width:0;
 padding:12px 18px;
 border-radius:25px 0 0 25px;
 border:1px solid #444;
 background:#181818;
 color:white;
 font-size:15px;
 outline:none;
}

.search button{
 padding:0 22px;
 border-radius:0 25px 25px 0;
 background:#303030;
 color:white;
 border:1px solid #444;
 cursor:pointer;
}

.profile{
 width:36px;
 height:36px;
 border-radius:50%;
 background:#4169e1;
 display:grid;
 place-items:center;
 font-weight:bold;
}

/* SIDEBAR */
.sidebar{
 position:fixed;
 top:65px;
 left:0;
 width:220px;
 height:100%;
 padding:15px 12px;
 background:#0f0f0f;
}

.sidebar div{
 padding:15px 12px;
 border-radius:10px;
 cursor:pointer;
 font-size:15px;
}

.sidebar div:hover,
.sidebar .active{
 background:#303030;
}

/* MAIN */
main{
 margin-left:220px;
 padding:95px 30px 30px;
}

.heading{
 font-size:22px;
 font-weight:bold;
 margin-bottom:25px;
}

/* FEATURED VIDEO */
.featured{
 max-width:950px;
 margin:auto;
 cursor:pointer;
}

.thumbnail{
 width:100%;
 aspect-ratio:16/9;
 background:#222;
 border-radius:15px;
 overflow:hidden;
 position:relative;
}

.thumbnail img{
 width:100%;
 height:100%;
 object-fit:cover;
}

.play{
 position:absolute;
 top:50%;
 left:50%;
 transform:translate(-50%,-50%);
 background:#ff0000;
 width:75px;
 height:55px;
 border-radius:15px;
 display:grid;
 place-items:center;
 font-size:30px;
}

.details{
 display:flex;
 gap:15px;
 padding:17px 5px;
}

.avatar{
 width:45px;
 height:45px;
 min-width:45px;
 border-radius:50%;
 background:#303f9f;
 display:grid;
 place-items:center;
 font-size:20px;
}

.video-title{
 font-size:21px;
 line-height:1.5;
 font-weight:bold;
}

.channel{
 color:#aaa;
 font-size:14px;
 margin-top:8px;
}

.stats{
 color:#aaa;
 font-size:13px;
 margin-top:6px;
}

.actions{
 display:flex;
 gap:12px;
 margin:15px 5px;
 flex-wrap:wrap;
}

.actions button{
 background:#272727;
 border:0;
 color:white;
 padding:11px 17px;
 border-radius:25px;
 cursor:pointer;
}

.actions button:hover{
 background:#444;
}

/* PLAYER */
#player{
 display:none;
 max-width:950px;
 margin:auto;
}

#player iframe{
 width:100%;
 aspect-ratio:16/9;
 border:0;
 border-radius:14px;
}

.back{
 background:#303030;
 color:white;
 padding:10px 20px;
 border:0;
 border-radius:8px;
 margin-bottom:15px;
 cursor:pointer;
}

@media(max-width:700px){
 header{padding:0 10px}
 .logo{font-size:18px}
 .search{width:52%}
 .search input{padding:10px}
 .sidebar{width:65px;padding:10px 4px}
 .sidebar div{
  text-align:center;
  font-size:10px;
  padding:14px 2px;
 }
 main{margin-left:65px;padding:85px 10px}
 .video-title{font-size:17px}
 .details{gap:10px}
}
</style>
</head>

<body>

<header>
 <div class="logo">▶ <span>YouTube</span></div>

 <div class="search">
  <input id="search" placeholder="Search">
  <button onclick="searchVideo()">🔍</button>
 </div>

 <div class="profile">M</div>
</header>

<aside class="sidebar">
 <div class="active" onclick="home()">🏠 Home</div>
 <div onclick="showMessage('Shorts')">⚡ Shorts</div>
 <div onclick="showMessage('Subscriptions')">📺 Subscriptions</div>
 <hr style="border-color:#333;margin:15px 0">
 <div onclick="showMessage('History')">🕘 History</div>
 <div onclick="showMessage('Your videos')">🎬 Your videos</div>
 <div onclick="showMessage('Liked videos')">👍 Liked videos</div>
</aside>

<main>

 <div id="homeContent">

  <div class="heading">Home</div>

  <div class="featured" onclick="playVideo()">

   <div class="thumbnail">
    <img src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=1200"
    alt="Featured video">
    <div class="play">▶</div>
   </div>

   <div class="details">
    <div class="avatar">M</div>

    <div>
     <div class="video-title">
      Amrit ka mausi is veri beautiful ❤️, Mayank wants to meert amrit mausi ji
     </div>

     <div class="channel">Mayank Official</div>

     <div class="stats">
      1.2M views • Just now
     </div>
    </div>
   </div>

   <div class="actions">
    <button onclick="event.stopPropagation();like(this)">👍 Like</button>
    <button onclick="event.stopPropagation();share()">↗ Share</button>
    <button onclick="event.stopPropagation();alert('Video saved!')">📥 Save</button>
   </div>

  </div>
 </div>

 <div id="player">
  <button class="back" onclick="home()">← Back to Home</button>
  <iframe id="frame"
   src=""
   allowfullscreen>
  </iframe>
  <h2 style="margin-top:18px">
   Amrit ka mausi is veri beautiful ❤️, Mayank wants to meert amrit mausi ji
  </h2>
  <p style="color:#aaa;margin-top:10px">Mayank Official</p>
 </div>

 <div id="message" style="display:none;font-size:22px"></div>

</main>

<script>

function playVideo(){
 document.getElementById("homeContent").style.display="none";
 document.getElementById("message").style.display="none";
 document.getElementById("player").style.display="block";

 document.getElementById("frame").src=
 "https://www.youtube-nocookie.com/embed/aqz-KE-bpKQ";
}

function home(){
 document.getElementById("homeContent").style.display="block";
 document.getElementById("player").style.display="none";
 document.getElementById("message").style.display="none";
 document.getElementById("frame").src="";
 document.getElementById("search").value="";
}

function showMessage(name){
 document.getElementById("homeContent").style.display="none";
 document.getElementById("player").style.display="none";
 document.getElementById("message").style.display="block";
 document.getElementById("message").textContent=name;
}

function searchVideo(){
 let q=document.getElementById("search").value.toLowerCase();
 let title="amrit ka mausi is veri beautiful mayank wants to meert amrit mausi ji";

 if(title.includes(q) && q!==""){
  home();
 }else if(q===""){
  home();
 }else{
  document.getElementById("homeContent").style.display="none";
  document.getElementById("player").style.display="none";
  document.getElementById("message").style.display="block";
  document.getElementById("message").textContent="No videos found";
 }
}

function like(btn){
 btn.textContent="👍 Liked";
}

function share(){
 if(navigator.clipboard){
  navigator.clipboard.writeText(location.href);
  alert("Website link copied!");
 }else{
  alert("Share your website link!");
 }
}

</script>

</body>
</html>
